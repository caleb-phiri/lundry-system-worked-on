<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Laundry Driver Portal</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      padding: 1rem;
    }
    .container {
      text-align: center;
      padding: 3rem 2rem;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.15);
      max-width: 420px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #34d399, #10b981);
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    h1 {
      color: #1f2937;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #6b7280;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:focus {
      outline: 3px solid rgba(16, 185, 129, 0.4);
      outline-offset: 2px;
    }
    .features {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }
    .features h3 {
      color: #9ca3af;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    .feature-list {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      color: #9ca3af;
      font-size: 0.75rem;
    }
    .feature-item svg {
      width: 1.5rem;
      height: 1.5rem;
      color: #10b981;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: #fef3c7;
      border-radius: 0.5rem;
      color: #92400e;
      font-size: 0.875rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .retry-count {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">📱</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some features may be limited while offline.</p>
    
    <button class="btn" onclick="window.location.reload()" id="retryBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Try Again
    </button>
    
    <div class="status-indicator" id="statusIndicator" style="display: none;">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Checking connection...</span>
    </div>
    
    <div class="retry-count" id="retryCount" style="display: none;"></div>
    
    <div class="features">
      <h3>Available Offline</h3>
      <div class="feature-list">
        <div class="feature-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          View cached orders
        </div>
        <div class="feature-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
          View earnings history
        </div>
        <div class="feature-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          View schedule
        </div>
        <div class="feature-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          View profile
        </div>
      </div>
    </div>
  </div>

  <script>
    let retryCount = 0;
    const maxRetries = 10;
    const retryBtn = document.getElementById('retryBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const retryCountEl = document.getElementById('retryCount');
    
    // Check online status
    function checkOnline() {
      return fetch('/favicon.ico', { method: 'HEAD', cache: 'no-cache', mode: 'no-cors' })
        .then(() => true)
        .catch(() => false);
    }
    
    // Auto-retry on online event
    window.addEventListener('online', () => {
      statusIndicator.style.display = 'inline-flex';
      statusIndicator.querySelector('span:last-child').textContent = 'Connection restored! Reloading...';
      statusIndicator.style.background = '#dcfce7';
      statusIndicator.style.color = '#166534';
      statusIndicator.querySelector('.status-dot').style.background = '#10b981';
      
      setTimeout(() => {
        window.location.reload();
      }, 1500);
    });
    
    // Manual retry
    retryBtn.addEventListener('click', async () => {
      retryBtn.disabled = true;
      retryBtn.innerHTML = `
        <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
          <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
        </svg>
        Checking...
      `;
      
      const isOnline = await checkOnline();
      
      if (isOnline) {
        window.location.reload();
      } else {
        retryCount++;
        retryBtn.disabled = false;
        retryBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Try Again
        `;
        
        if (retryCount >= 3) {
          statusIndicator.style.display = 'inline-flex';
          retryCountEl.style.display = 'block';
          retryCountEl.textContent = `Attempt ${retryCount} of ${maxRetries}. Will auto-retry when connection returns.`;
        }
      }
    });
    
    // Periodic check
    setInterval(async () => {
      if (navigator.onLine) {
        const isOnline = await checkOnline();
        if (isOnline) {
          window.location.reload();
        }
      }
    }, 30000);
    
    // Spinner animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spinner { animation: spin 1s linear infinite; }
    `;
    document.head.appendChild(style);
    
    // Service worker registration for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => {
          console.log('SW registered for offline page');
        })
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
